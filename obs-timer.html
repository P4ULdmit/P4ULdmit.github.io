<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таймер для OBS</title>
    <style>
        body {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: transparent;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }
        
        #timer {
            font-size: 72px;
            margin: 20px 0;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
        }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        
        button {
            padding: 8px 16px;
            font-size: 16px;
            cursor: pointer;
            background-color: #444;
            color: white;
            border: none;
            border-radius: 4px;
        }
        
        button:hover {
            background-color: #555;
        }
        
        #settings {
            margin-top: 20px;
            padding: 15px;
            background-color: rgba(0, 0, 0, 0.3);
            border-radius: 8px;
        }
        
        .setting-group {
            margin-bottom: 10px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
        }
        
        select, input {
            padding: 5px;
            width: 100%;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div id="timer">00:00:00</div>
    
    <div class="controls">
        <button id="add10min">+10 мин</button>
        <button id="startPause">Старт/Пауза</button>
        <button id="reset">Сброс</button>
    </div>
    
    <div id="settings">
        <div class="setting-group">
            <label for="fontFamily">Шрифт:</label>
            <select id="fontFamily">
                <option value="Arial, sans-serif">Arial</option>
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Courier New', monospace">Courier New</option>
                <option value="Verdana, sans-serif">Verdana</option>
                <option value="Impact, sans-serif">Impact</option>
                <option value="'Comic Sans MS', cursive">Comic Sans MS</option>
                <option value="Georgia, serif">Georgia</option>
            </select>
        </div>
        
        <div class="setting-group">
            <label for="fontSize">Размер шрифта (px):</label>
            <input type="number" id="fontSize" value="72" min="10" max="200">
        </div>
        
        <div class="setting-group">
            <label for="textColor">Цвет текста:</label>
            <input type="color" id="textColor" value="#ffffff">
        </div>
    </div>

    <script>
        // Элементы DOM
        const timerElement = document.getElementById('timer');
        const add10minBtn = document.getElementById('add10min');
        const startPauseBtn = document.getElementById('startPause');
        const resetBtn = document.getElementById('reset');
        const fontFamilySelect = document.getElementById('fontFamily');
        const fontSizeInput = document.getElementById('fontSize');
        const textColorInput = document.getElementById('textColor');
        
        // Переменные таймера
        let timeLeft = 0; // в секундах
        let timerInterval = null;
        let isPaused = true;
        
        // Обновление отображения таймера
        function updateTimerDisplay() {
            const hours = Math.floor(timeLeft / 3600);
            const minutes = Math.floor((timeLeft % 3600) / 60);
            const seconds = timeLeft % 60;
            
            timerElement.textContent = 
                `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
        }
        
        // Запуск таймера
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            isPaused = false;
            startPauseBtn.textContent = 'Пауза';
            
            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateTimerDisplay();
                } else {
                    clearInterval(timerInterval);
                    timerInterval = null;
                    isPaused = true;
                    startPauseBtn.textContent = 'Старт';
                }
            }, 1000);
        }
        
        // Пауза таймера
        function pauseTimer() {
            if (timerInterval) {
                clearInterval(timerInterval);
                timerInterval = null;
                isPaused = true;
                startPauseBtn.textContent = 'Старт';
            }
        }
        
        // Добавление времени
        function addTime(secondsToAdd) {
            timeLeft += secondsToAdd;
            updateTimerDisplay();
        }
        
        // Сброс таймера
        function resetTimer() {
            pauseTimer();
            timeLeft = 0;
            updateTimerDisplay();
        }
        
        // Обработчики событий
        add10minBtn.addEventListener('click', () => {
            addTime(600); // 10 минут = 600 секунд
        });
        
        startPauseBtn.addEventListener('click', () => {
            if (isPaused) {
                startTimer();
            } else {
                pauseTimer();
            }
        });
        
        resetBtn.addEventListener('click', resetTimer);
        
        // Настройки внешнего вида
        fontFamilySelect.addEventListener('change', () => {
            timerElement.style.fontFamily = fontFamilySelect.value;
        });
        
        fontSizeInput.addEventListener('input', () => {
            timerElement.style.fontSize = `${fontSizeInput.value}px`;
        });
        
        textColorInput.addEventListener('input', () => {
            timerElement.style.color = textColorInput.value;
        });
        
        // Инициализация
        updateTimerDisplay();
    </script>
</body>
</html>
